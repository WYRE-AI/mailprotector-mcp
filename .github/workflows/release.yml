name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Thin caller for the canonical reusable release pipeline. The build →
# semantic-release → Docker → MCP Registry → security chain (tag-based release
# detection + correct gating) lives in wyre-technology/.github so every *-mcp
# repo stays in lockstep instead of drifting per-repo. Caller jobs grant the
# token scopes the reusable jobs request (a reusable can only reduce, never
# expand, caller-granted scope).
jobs:
  release:
    permissions:
      contents: write
      issues: write
      pull-requests: write  # @semantic-release/github success step reads/comments on PRs
      packages: write
      id-token: write
      security-events: write
    uses: wyre-technology/.github/.github/workflows/mcp-server-release.yml@d28a612a00a1bd0c36aff09e686ce2d1e10ef552
    with:
      server-name: mailprotector-mcp
      image-name: ghcr.io/wyre-technology/mailprotector-mcp
    secrets: inherit

# NO `deploy:` job — deliberate. Mailprotector is a CONDUIT-ONLY vendor.
#
# The fleet-standard `mcp-server-deploy.yml` deploys to `gwp-<slug>` in the
# `mcp-gateway-prod` resource group — the separate, still-live legacy fleet,
# NOT conduit. Conduit's sidecars are deployed from
# `azure/vendor-fleet.conduit-prod.bicepparam` by conduit's own
# `deploy-vendor-fleet.yml`. Nothing in this repo deploys conduit, so the job
# would have nothing to do here: with no `gwp-mailprotector` Container App and
# no Azure federated identity credential for this repo, it could only ever
# fail (AADSTS7002131 — see connectwise-cpq-mcp's v1.0.0 release for the
# precedent). Matches the other conduit-only vendors: connectwise-cpq-mcp,
# scalepad-mcp, and clio-mcp all call `mcp-server-release.yml` with no deploy
# job.
#
# If Mailprotector is ever wanted on the legacy gateway too, all three are
# required:
#   1. az ad app federated-credential create for this repo's production subject
#   2. create the `gwp-mailprotector` ACA in `mcp-gateway-prod`
#   3. register the vendor in the `mcp-gateway` repo
# then add the deploy job.
